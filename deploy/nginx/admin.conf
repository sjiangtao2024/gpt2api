server {
    listen 17088 ssl http2;
    listen [::]:17088 ssl http2;
    server_name admin.klein.example;
    resolver 127.0.0.11 ipv6=off valid=10s;

    set $klein_admin_api http://admin:17188;
    set $klein_admin_web http://admin-web:80;

    ssl_certificate     /etc/nginx/certs/admin.klein.example.crt;
    ssl_certificate_key /etc/nginx/certs/admin.klein.example.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin always;

    # 白名单（请按运营 / 客服公网 IP 实际配置）
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    location /admin/api/ {
        proxy_pass $klein_admin_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass $klein_admin_web;
        proxy_set_header Host $host;
    }
}
